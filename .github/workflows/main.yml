name: Build Ascendia Kernel (A52s - stock)

on:
  workflow_dispatch:
  push:
    branches:
      - stock

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout stock branch
        uses: actions/checkout@v4
        with:
          ref: stock

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git curl wget zip unzip flex bison bc cpio \
            build-essential libssl-dev libelf-dev \
            python3 python-is-python3 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Setup Clang (main-r530567)
        run: |
          mkdir -p clang
          cd clang

          wget -O clang.tar.gz \
            https://github.com/danjekb/tools/releases/download/clang/main-clang-r530567.tar.gz

          tar -xzf clang.tar.gz
          rm clang.tar.gz

          echo "$PWD/bin" >> $GITHUB_PATH

      - name: Build environment
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV

      - name: Configure kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH

          # Wczytaj domyślną konfigurację
          make O=out ARCH=arm64 vendor/a52sxq_eur_open_defconfig

          # Wyłącz problematyczne funkcje
          scripts/config --file out/.config \
            --disable LTO_CLANG \
            --disable CFI_CLANG \
            --disable SHADOW_CALL_STACK \
            --disable LTO \
            --disable THINLTO \
            --disable CFI_CLANG_SHADOW

          # Zsynchro.nizuj konfigurację
          make O=out ARCH=arm64 olddefconfig

      - name: Build kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH

          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KBUILD_CFLAGS="-Wno-strict-prototypes -Wno-error=strict-prototypes"

      - name: Collect outputs
        run: |
          mkdir -p artifacts

          find . -type f -name "boot.img" -exec cp {} artifacts/ \; || true
          find . -type f -name "vendor_boot.img" -exec cp {} artifacts/ \; || true
          find . -type f -name "dtbo.img" -exec cp {} artifacts/ \; || true

          find out -type f -name "Image*" -exec cp {} artifacts/ \; || true
          find out -type f -name "*.dtb" -exec cp {} artifacts/ \; || true

          echo "=== RESULT ==="
          ls -lah artifacts || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: A52s-Kernel-Stock-Build
          path: artifacts/*
          if-no-files-found: warn
